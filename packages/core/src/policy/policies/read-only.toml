# Priority system for policy rules:
# - Higher priority numbers win over lower priority numbers
# - When multiple rules match, the highest priority rule is applied
# - Rules are evaluated in order of priority (highest first)
#
# Priority bands (tiers):
# - Default policies (TOML): 1 + priority/1000 (e.g., priority 100 → 1.100)
# - Extension policies (TOML): 2 + priority/1000 (e.g., priority 100 → 2.100)
# - Workspace policies (TOML): 3 + priority/1000 (e.g., priority 100 → 3.100)
# - User policies (TOML): 4 + priority/1000 (e.g., priority 100 → 4.100)
# - Admin policies (TOML): 5 + priority/1000 (e.g., priority 100 → 5.100)
#
# This ensures Admin > User > Workspace > Extension > Default hierarchy is always preserved,
# while allowing user-specified priorities to work within each tier.
#
# Settings-based and dynamic rules (all in user tier 4.x):
#   4.95: Tools that the user has selected as "Always Allow" in the interactive UI
#   4.9:  MCP servers excluded list (security: persistent server blocks)
#   4.4:  Command line flag --exclude-tools (explicit temporary blocks)
#   4.3:  Command line flag --allowed-tools (explicit temporary allows)
#   4.2:  MCP servers with trust=true (persistent trusted servers)
#   4.1:  MCP servers allowed list (persistent general server allows)
#
# TOML policy priorities (before transformation):
#   10: Write tools default to ASK_USER (becomes 1.010 in default tier)
#   15: Auto-edit tool override (becomes 1.015 in default tier)
#   50: Read-only tools (becomes 1.050 in default tier)
#   999: YOLO mode allow-all (becomes 1.999 in default tier)

[[rule]]
toolName = [
  "glob",
  "grep_search",
  "list_directory",
  "read_file",
  "google_web_search",
  "codebase_investigator",
  "cli_help",
  "get_internal_docs",
  # Tracker tools for task management (safe as they only modify internal state)
  "tracker_create_task",
  "tracker_update_task",
  "tracker_get_task",
  "tracker_list_tasks",
  "tracker_add_dependency",
  "tracker_visualize",
  # Topic grouping tool is innocuous and used for UI organization.
  "update_topic",
  # Core agent lifecycle tool
  "complete_task",
  # MCP resource tools
  "read_mcp_resource",
  "list_mcp_resources",
  # Background process management tools
  "list_background_processes",
  "read_background_output",
  "kill_background_process",
  "write_background_input"
]
decision = "allow"
priority = 50

# Safe, read-only, informational, and diagnostic shell commands auto-allowed without confirmation prompts
[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  "ping",
  "curl",
  "wget",
  "nc",
  "netstat",
  "ss",
  "ip",
  "ifconfig",
  "traceroute",
  "nslookup",
  "dig",
  "host",
  "uname",
  "uptime",
  "whoami",
  "id",
  "hostname",
  "date",
  "df",
  "du",
  "free",
  "ps",
  "top",
  "htop",
  "lsof",
  "lsblk",
  "lscpu",
  "arch",
  "cat",
  "head",
  "tail",
  "less",
  "more",
  "ls",
  "dir",
  "pwd",
  "tree",
  "stat",
  "file",
  "wc",
  "diff",
  "grep",
  "egrep",
  "fgrep",
  "rg",
  "ag",
  "find",
  "which",
  "whereis",
  "type",
  "echo",
  "printf",
  "sort",
  "uniq",
  "awk",
  "cut",
  "tr",
  "column",
  "node -v",
  "node --version",
  "npm -v",
  "npm --version",
  "npm list",
  "npx -v",
  "yarn -v",
  "pnpm -v",
  "python --version",
  "python3 --version",
  "pip list",
  "cargo --version",
  "rustc --version",
  "go version",
  "git --version",
  "tsc --version",
  "env",
  "printenv",
  "git status",
  "git log",
  "git diff",
  "git branch",
  "git show",
  "git tag",
  "git remote",
  "git stash list"
]
